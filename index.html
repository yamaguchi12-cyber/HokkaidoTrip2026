<style>
#mapbox { height: 52vh; min-height: 280px; border-radius: 12px; border: 1px solid var(--line); margin: 8px 0; z-index: 0; }
.leaflet-container { font: inherit; }
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #1d2733; --muted: #5a6776; --line: #d5dce3;
  --accent: #1f4e79; --accent-ink: #ffffff; --warn: #8a4b00; --warn-bg: #fff3e0; --danger: #b3261e; --hi: #b3261e; --lo: #1f5f8b;
  --k-food: #fde7d6; --k-sight: #dcefdc; --k-stay: #e3e0f5; --k-move: #e2e8ee; --k-shop: #fbe3ef; --k-other: #f1ecd5;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161c; --surface: #1b232c; --ink: #e8edf2; --muted: #a2afbd; --line: #33404d; --accent: #8cc2f0; --accent-ink: #0b1620;
    --warn: #ffcc80; --warn-bg: #3a2a10; --danger: #ff8a80; --hi: #ff8a80; --lo: #8cc2f0;
    --k-food: #4a3324; --k-sight: #243d27; --k-stay: #302d4d; --k-move: #2a343e; --k-shop: #4a2a3b; --k-other: #3c3921; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: underline; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; gap: 8px; padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top)); }
header.top h1 { font-size: 18px; margin: 0; flex: 1; line-height: 1.4; }
header.top button { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 8px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
h2 { font-size: 18px; margin: 24px 0 8px; line-height: 1.5; }
h3 { font-size: 16px; margin: 16px 0 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 8px 0; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs a { flex: 1; text-align: center; padding: 8px 2px; min-height: 56px; font-size: 13px; line-height: 1.3; color: var(--muted); text-decoration: none; display: flex; flex-direction: column; justify-content: center; }

nav.tabs a.on { color: var(--accent); font-weight: 700; border-top: 3px solid var(--accent); }
.fab { position: fixed; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 7; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: pointer; }
/* 付箋カード */
.note { display: flex; gap: 12px; border-radius: 12px; border: 1px solid var(--line); padding: 10px 12px; margin: 8px 0; background: var(--k-other); color: var(--ink); text-decoration: none; }
.note.k-食事 { background: var(--k-food); } .note.k-観光 { background: var(--k-sight); } .note.k-宿 { background: var(--k-stay); }
.note.k-移動 { background: var(--k-move); } .note.k-買い物 { background: var(--k-shop); }
.note.rejected { opacity: .6; }
.note .ph { width: 72px; height: 72px; flex: none; border-radius: 8px; background: var(--surface) center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); text-align: center; overflow: hidden; }
.note .tt { font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
.note .sm { font-size: 14px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
/* タイムライン */
.tl { border-left: 3px solid var(--accent); margin: 12px 0 12px 8px; padding-left: 12px; }

.gap { margin: 10px 0; padding: 8px 12px; border: 2px dashed var(--accent); border-radius: 12px; color: var(--accent); font-weight: 700; }
/* 入力 */
label.f { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--muted); }
input[type=text], input[type=url], input[type=time], input[type=number], select, textarea { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
textarea { min-height: 96px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
.sheet h2 { margin-top: 0; }

.wx-pop { font-size: 14px; margin-top: 2px; }
.wx-bar { display: block; height: 6px; border-radius: 3px; background: var(--line); margin: 4px 0; overflow: hidden; }

.photos { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
.photos .p { position: relative; flex: none; }

.cm { border-bottom: 1px solid var(--line); padding: 8px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom)); background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: 90%; }
.who { font-size: 13px; }
:focus-visible { outline: 3px solid #f5a623; outline-offset: 2px; }
.detail-text { white-space: pre-wrap; overflow-wrap: anywhere; }

</style>

<body>
<header class="top">
  <h1 id="ttl">北海道旅行2026</h1>
  <span class="who" id="whoLabel"></span>
  <button id="btnRefresh" aria-label="更新">更新</button>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<button class="fab" id="fab" aria-label="付箋を追加">＋</button>
<div id="layer"></div>

<script>
// 北海道旅行アプリ — 純粋ロジック（Node でテスト可能。Apps Script ではそのまま同じプロジェクトに core.gs として置く）
// Google 側の部品（シート・Drive・UrlFetch）は store / svc として外から渡す。

var TRIP_DAYS = ['2026-11-22', '2026-11-23', '2026-11-24'];
var STD_COLS = ['createdBy', 'updatedBy', 'createdAt', 'updatedAt', 'deleted'];
var TABLES = {
  notes: ['id', 'title', 'kind', 'status', 'urls', 'photos', 'thumb', 'summary', 'address', 'lat', 'lng',
    'hours', 'closed', 'reservation', 'budget', 'duration', 'day', 'needsBoost', 'ogpStatus', 'detail'].concat(STD_COLS),
  events: ['id', 'day', 'start', 'end', 'order', 'title', 'kind', 'transport', 'travelMin', 'noteId', 'memo'].concat(STD_COLS),
  comments: ['id', 'targetType', 'targetId', 'body'].concat(STD_COLS),
  packing: ['id', 'item', 'owner', 'done', 'memo'].concat(STD_COLS),
  reservations: ['id', 'kind', 'name', 'datetime', 'code', 'memo', 'noteId'].concat(STD_COLS),
  costs: ['id', 'item', 'amount', 'day', 'noteId', 'paid'].concat(STD_COLS),
  todos: ['id', 'text', 'day', 'state', 'decision', 'noteId'].concat(STD_COLS),
  settings: ['id', 'value'].concat(STD_COLS)
};
var NOTE_KINDS = ['食事', '観光', '宿', '移動', '買い物', 'その他'];
var NOTE_STATUSES = ['候補', '採用', '保留', '却下'];
var CELL_MAX = 49000;
var MAX_PHOTOS = 5;
var BLOCKED_DOMAINS = ['instagram.com', 'twitter.com', 'x.com', 'tiktok.com', 'facebook.com', 'threads.net'];

// ---------- 時刻 ----------
function toMin(s) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim());
  if (!m) return null;
  return Number(m[1]) * 60 + Number(m[2]);
}
function fromMin(n) {
  var h = Math.floor(n / 60), mm = n % 60;
  return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
}
function parseDurationMin(s) {
  // 「90分」「1.5時間」「2時間」「1時間30分」→ 分。読めなければ null
  var t = String(s || '').replace(/\s/g, '');
  var m = /^(\d+(?:\.\d+)?)時間(?:(\d+)分)?$/.exec(t);
  if (m) return Math.round(Number(m[1]) * 60 + (m[2] ? Number(m[2]) : 0));
  m = /^(\d+)分$/.exec(t);
  if (m) return Number(m[1]);
  return null;
}

// ---------- 予定の並び・点検 ----------
function sortEvents(events) {
  return events.slice().sort(function (a, b) {
    var ta = toMin(a.start), tb = toMin(b.start);
    if (ta === null && tb === null) return (Number(a.order) || 0) - (Number(b.order) || 0);
    if (ta === null) return 1;      // 時刻未定は後ろ（日別ページでは別枠に出す）
    if (tb === null) return -1;
    if (ta !== tb) return ta - tb;
    return (Number(a.order) || 0) - (Number(b.order) || 0);
  });
}
function eventEndMin(ev, note) {
  var s = toMin(ev.start);
  if (s === null) return null;
  var e = toMin(ev.end);
  if (e !== null) return e;
  var d = note ? parseDurationMin(note.duration) : null;
  return d !== null ? s + d : s;
}
// 日の予定を点検する。返り値は時刻つき予定の行ごとの注意と、時刻未定の予定
//   gapBefore: 直前の予定の終わりからの空き（分。GAP_MIN 以上のときだけ）
//   warns: 「時間が重なっています」「移動時間が足りません」
function analyzeDay(events, notesById, gapMin) {
  var limit = gapMin == null ? 90 : gapMin;
  var sorted = sortEvents(events.filter(function (e) { return !isDeleted(e); }));
  var timed = sorted.filter(function (e) { return toMin(e.start) !== null; });
  var untimed = sorted.filter(function (e) { return toMin(e.start) === null; });
  var rows = [];
  var prev = null, prevEnd = null;
  timed.forEach(function (ev) {
    var note = ev.noteId ? notesById[ev.noteId] : null;
    var s = toMin(ev.start);
    var row = { event: ev, note: note || null, warns: [], gapBefore: null };
    if (prev) {
      if (s < prevEnd) row.warns.push('前の予定（' + prev.title + '）と時間が重なっています');
      var travel = Number(ev.travelMin);
      if (travel > 0 && prevEnd + travel > s) row.warns.push('移動時間が足りません（前の予定の終わり＋' + travel + '分が開始を過ぎます）');
      if (s - prevEnd >= limit && !row.warns.length) row.gapBefore = s - prevEnd;
    }
    rows.push(row);
    prev = ev;
    var end = eventEndMin(ev, note);
    prevEnd = prevEnd === null ? end : Math.max(prevEnd, end);
  });
  return { timed: rows, untimed: untimed.map(function (ev) { return { event: ev, note: ev.noteId ? notesById[ev.noteId] || null : null }; }) };
}

// ---------- 付箋の補助 ----------
function isDeleted(r) { return !!(r && r.deleted && r.deleted !== '0'); }
function parseJson(s, fallback) {
  if (Array.isArray(s)) return s;
  try { var v = JSON.parse(s); return Array.isArray(v) ? v : fallback; } catch (e) { return fallback; }
}
function hostOf(url) {
  var m = /^https?:\/\/([^\/?#:]+)/i.exec(String(url || '').trim());
  return m ? m[1].toLowerCase().replace(/^www\./, '') : '';
}
function isBlockedDomain(url) {
  var h = hostOf(url);
  return BLOCKED_DOMAINS.some(function (d) { return h === d || h.slice(-(d.length + 1)) === '.' + d; });
}
function domainLabel(url) {
  var h = hostOf(url);
  if (!h) return '';
  var map = { 'instagram.com': 'Instagram', 'x.com': 'X', 'twitter.com': 'X', 'tiktok.com': 'TikTok', 'facebook.com': 'Facebook',
    'threads.net': 'Threads', 'tabelog.com': '食べログ', 'youtube.com': 'YouTube', 'youtu.be': 'YouTube', 'maps.app.goo.gl': 'Google マップ',
    'goo.gl': 'Google マップ' };
  return map[h] || h;
}
function guessKind(url) {
  var h = hostOf(url);
  if (/tabelog|gnavi|hotpepper|retty|gurunavi|ramendb/.test(h)) return '食事';
  if (/jalan|rakuten.*travel|ikyu|booking|agoda|hoshinoresorts|expedia/.test(h)) return '宿';
  return 'その他';
}
function extractUrls(text) {
  var m = String(text || '').match(/https?:\/\/[^\s<>"'）)」]+/g);
  return m || [];
}

// 共有メニュー（ショートカット）から開くURLの「add=…」を取り出す。text は付箋に入れる文字列、hash は add を除いたもの
function takeAddParam(hash) {
  var h = String(hash || ''), text = '';
  var re = /([#&])add=([^&]*)/;
  var m = re.exec(h);
  if (!m) return { text: '', hash: h };
  try { text = decodeURIComponent(m[2].replace(/\+/g, ' ')); } catch (e) { text = m[2]; }
  h = h.replace(re, function (_, sep) { return sep === '#' ? '#' : ''; }).replace(/^#&/, '#');
  return { text: text.trim().slice(0, 2000), hash: h === '#' ? '' : h };
}

// HTML から OGP（タイトル・説明・画像）を取り出す
function decodeEntities_(s) {
  return String(s).replace(/&(#x[0-9a-fA-F]+|#\d+|amp|lt|gt|quot|apos|nbsp);/g, function (all, e) {
    if (e === 'amp') return '&'; if (e === 'lt') return '<'; if (e === 'gt') return '>';
    if (e === 'quot') return '"'; if (e === 'apos') return "'"; if (e === 'nbsp') return ' ';
    var code = e.charAt(1) === 'x' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
    return isNaN(code) ? all : String.fromCodePoint(code);
  });
}
function absUrl_(u, base) {
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  var m = /^(https?:\/\/[^\/?#]+)/i.exec(base || '');
  if (!m) return '';
  if (u.indexOf('//') === 0) return /^https/i.test(base) ? 'https:' + u : 'http:' + u;
  if (u.charAt(0) === '/') return m[1] + u;
  return '';
}
function parseOgp(html, baseUrl) {
  var src = String(html || '');
  var metas = {};
  var re = /<meta\b([^>]*)>/gi, m;
  while ((m = re.exec(src)) !== null) {
    var attrs = {}, ar = /([a-zA-Z:_-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g, a;
    while ((a = ar.exec(m[1])) !== null) attrs[a[1].toLowerCase()] = a[2] !== undefined ? a[2] : a[3];
    var key = (attrs.property || attrs.name || '').toLowerCase();
    if (key && attrs.content !== undefined && metas[key] === undefined) metas[key] = decodeEntities_(attrs.content).trim();
  }
  var t = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(src);
  var title = metas['og:title'] || metas['twitter:title'] || (t ? decodeEntities_(t[1]).replace(/\s+/g, ' ').trim() : '');
  var description = metas['og:description'] || metas['twitter:description'] || metas.description || '';
  var image = absUrl_(metas['og:image'] || metas['twitter:image'] || '', baseUrl);
  if (!title && !description && !image) return null;
  return { title: title, description: description, image: image };
}

// ---------- 天気（settings の weather:YYYY-MM-DD） ----------
// value は JSON {src, places:[{name,label,max,min,pop,rel,sunrise,sunset,msg}], notes:[…]}。昔の自由記述はそのまま notes に入れる
function parseWeather(value) {
  var w = { src: '', places: [], notes: [] };
  var s = String(value == null ? '' : value).trim();
  if (!s) return w;
  if (s.charAt(0) === '{') {
    try {
      var o = JSON.parse(s);
      if (o && typeof o === 'object') {
        w.src = String(o.src || '');
        w.places = Array.isArray(o.places) ? o.places.filter(function (p) { return p && typeof p === 'object'; }) : [];
        w.notes = Array.isArray(o.notes) ? o.notes.map(String) : (o.notes ? [String(o.notes)] : []);
        return w;
      }
    } catch (e) { /* 自由記述として扱う */ }
  }
  w.notes = [s];
  return w;
}

// 天気の言葉から絵文字（「くもり一時雪」→ ☁️❄️、「雪時々晴れ」→ ❄️☀️）
function weatherIcons(label) {
  var s = String(label || '');
  var ic = function (t) { if (/雪/.test(t)) return '❄️'; if (/雨|みぞれ/.test(t)) return '🌧️'; if (/くもり|曇/.test(t)) return '☁️'; if (/晴/.test(t)) return '☀️'; return ''; };
  var m = /(時々|一時|のち|後)/.exec(s);
  if (!m) return ic(s) || '🌡️';
  var a = ic(s.slice(0, m.index)), b = ic(s.slice(m.index + m[0].length));
  return a && b && a !== b ? a + b : (a || b || '🌡️');
}

function cleanRow_(table, row) {

  var out = list.slice();

// ---------- RPC（Google 側は store / svc で差し替え） ----------
// store: list(table) / get(table,id) / put(table,row)
// svc:   now() / newId(prefix) / fetchUrl(url) -> {text, finalUrl} / savePhoto(noteId, base64) -> fileId
// role:  'view'（2人の画面）または 'api'（Claude）
function handleRpc(store, svc, role, req) {
  var who = String(req.who || '').slice(0, 20) || (role === 'api' ? 'Claude' : '不明');
  switch (req.action) {
    case 'ping': return { ok: true, now: svc.now() };
    case 'sync': return rpcSync_(store, svc, req);
    case 'save': return rpcSave_(store, svc, role, who, req);
    case 'remove': return rpcRemove_(store, svc, who, req);
    case 'fetchOgp': return rpcFetchOgp_(store, svc, req);
    case 'uploadPhoto': return rpcUploadPhoto_(store, svc, who, req);
    case 'removePhoto': return rpcRemovePhoto_(store, svc, who, req);
    case 'geocode': return rpcGeocode_(store, svc, who, req);
    case 'export':
      if (role !== 'api') return { error: 'forbidden' };
      var all = {};
      Object.keys(TABLES).forEach(function (t) { all[t] = store.list(t).filter(function (r) { return !isDeleted(r); }); });
      return { now: svc.now(), tables: all };
    default: return { error: 'unknown action' };
  }
}

function rpcSync_(store, svc, req) {
  var since = String(req.since || '');
  var tables = {};
  Object.keys(TABLES).forEach(function (t) {
    tables[t] = store.list(t).filter(function (r) {
      return since ? String(r.updatedAt || '') > since : !isDeleted(r);
    });
  });
  return { now: svc.now(), tables: tables };
}

function rpcSave_(store, svc, role, who, req) {
  var table = req.table;
  if (!TABLES[table]) return { error: 'unknown table' };
  var row = req.row || {};
  var now = svc.now();
  var existing = row.id ? store.get(table, row.id) : null;
  if (existing) {
    if (req.base !== undefined && req.base !== null && existing.updatedAt !== req.base) return { conflict: true, current: existing };
    var merged = {};
    TABLES[table].forEach(function (c) { merged[c] = row[c] !== undefined ? row[c] : existing[c]; });
    merged.id = existing.id;
    merged.createdBy = existing.createdBy; merged.createdAt = existing.createdAt;
    merged.updatedBy = who; merged.updatedAt = now;
    var saved = cleanRow_(table, merged);
    store.put(table, saved);
    return { row: saved };
  }
  var fresh = {};
  TABLES[table].forEach(function (c) { fresh[c] = row[c] !== undefined ? row[c] : ''; });
  fresh.id = row.id || svc.newId(table.charAt(0));
  fresh.createdBy = who; fresh.updatedBy = who; fresh.createdAt = now; fresh.updatedAt = now; fresh.deleted = '';
  if (table === 'notes') {
    if (!fresh.kind) fresh.kind = 'その他';
    if (!fresh.status) fresh.status = '候補';
    if (fresh.urls && !fresh.title) fresh.ogpStatus = fresh.ogpStatus || 'pending';
  }
  var cleaned = cleanRow_(table, fresh);
  store.put(table, cleaned);
  return { row: cleaned };
}

function rpcRemove_(store, svc, who, req) {
  if (!TABLES[req.table]) return { error: 'unknown table' };
  var existing = store.get(req.table, req.id);
  if (!existing) return { error: 'not found' };
  existing.deleted = '1'; existing.updatedBy = who; existing.updatedAt = svc.now();
  store.put(req.table, existing);
  return { row: existing };
}

function rpcFetchOgp_(store, svc, req) {
  var n = store.get('notes', req.id);
  if (!n) return { error: 'not found' };
  var urls = parseJson(n.urls, []);
  var url = urls[0];
  if (!url) return { row: n };
  var info = null;
  if (isBlockedDomain(url)) {
    n.ogpStatus = 'blocked';
  } else {
    try {
      var res = svc.fetchUrl(url);
      info = parseOgp(res.text, res.finalUrl || url);
    } catch (e) { info = null; }
    n.ogpStatus = info ? 'ok' : 'failed';
  }
  if (info) {
    if (!n.title && info.title) n.title = info.title.slice(0, 120);
    if (!n.summary && info.description) n.summary = info.description.slice(0, 300);
    if (!n.thumb && parseJson(n.photos, []).length === 0 && info.image) n.thumb = info.image;
    if (!info.description && !info.image) n.needsBoost = '1';
  } else {
    if (!n.title) n.title = domainLabel(url) + 'のリンク';
    n.needsBoost = '1';
  }
  n.updatedBy = '自動取得'; n.updatedAt = svc.now();
  store.put('notes', n);
  return { row: n };
}

function rpcUploadPhoto_(store, svc, who, req) {
  var n = store.get('notes', req.id);
  if (!n) return { error: 'not found' };
  var photos = parseJson(n.photos, []);
  if (photos.length >= MAX_PHOTOS) return { error: '写真は1付箋に' + MAX_PHOTOS + '枚までです' };
  var fileId = svc.savePhoto(n.id, req.data);
  photos.push(fileId);
  n.photos = JSON.stringify(photos);
  if (req.thumb && (photos.length === 1 || !n.thumb || /^https?:/.test(n.thumb))) n.thumb = String(req.thumb).slice(0, CELL_MAX);
  n.updatedBy = who; n.updatedAt = svc.now();
  store.put('notes', n);
  return { row: n };
}

// 住所から緯度経度を求めて付箋に保存する（svc.geocode は Apps Script では Maps.newGeocoder）。取れなければ付箋はそのまま
function rpcGeocode_(store, svc, who, req) {
  var n = store.get('notes', req.id);
  if (!n) return { error: 'not found' };
  var addr = String(req.address || n.address || '').trim();
  if (!addr) return { row: n, located: false };
  var g = null;
  try { g = svc.geocode(addr); } catch (e) { g = null; }
  if (!g || isNaN(Number(g.lat)) || isNaN(Number(g.lng))) return { row: n, located: false };
  n.lat = String(g.lat); n.lng = String(g.lng);
  n.updatedBy = who; n.updatedAt = svc.now();
  store.put('notes', n);
  return { row: n, located: true };
}

function rpcRemovePhoto_(store, svc, who, req) {
  var n = store.get('notes', req.id);
  if (!n) return { error: 'not found' };
  var photos = parseJson(n.photos, []).filter(function (p) { return p !== req.fileId; });
  n.photos = JSON.stringify(photos);
  if (!photos.length && n.thumb && n.thumb.indexOf('data:') === 0) n.thumb = '';
  n.updatedBy = who; n.updatedAt = svc.now();
  store.put('notes', n);
  return { row: n };
}

// ---------- 写真の縮小（端末側） ----------
function resizeImage(file, maxSide, quality) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var s = Math.min(1, maxSide / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('画像を読み込めません')); };
    img.src = url;
  });
}

        return rpc({ action: 'uploadPhoto', id: noteId, data: r[0], thumb: r[1] });
      }).then(function (res) { applyRows({ notes: [res.row] }); saveCache(); });

// ---------- イベント ----------
document.addEventListener('click', function (ev) {
  var w = ev.target.closest('[data-who]');
  if (w) { S.who = w.dataset.who; lsSet('hk_who', S.who); closeSheet(); render(); sync(); if (S.pendingAdd) { var pa = S.pendingAdd; S.pendingAdd = ''; openQuickAdd(pa); } return; }
  // 画面内のリンク（#/day/1 など）は、枠の外へ飛ばさず、この画面の中で切り替える
  var an = ev.target.closest('a[href^="#/"]');
  if (an && !ev.target.closest('[data-act]')) { ev.preventDefault(); location.hash = an.getAttribute('href') + (TOKEN ? '&t=' + TOKEN : ''); return; }
  var b = ev.target.closest('[data-act]'); if (!b) return;
  ev.preventDefault();   // 付箋カード（リンク）の中のボタンでも画面遷移しない
  var a = b.dataset.act, id = b.dataset.id;
  if (a === 'who') chooseWho();
  else if (a === 'addEvent') openEventSheet(null, b.dataset.date);
  else if (a === 'editEvent') openEventSheet(live('events').filter(function (e) { return e.id === id; })[0]);
  else if (a === 'evUp') moveEvent(id, -1);
  else if (a === 'evDown') moveEvent(id, 1);
  else if (a === 'pick') openPick(b.dataset.date);
  else if (a === 'pickKind') openPick(b.dataset.date, b.dataset.kind, b.dataset.area);
  else if (a === 'assign') {
    var date = b.dataset.date, n = noteById(b.dataset.note);
    closeSheet();
    openEventSheet(null, date, n.id);
    document.getElementById('e_title').value = n.title || domainLabel(parseJson(n.urls, [])[0]);
    document.getElementById('e_kind').value = n.kind;
  }
  else if (a === 'weather') {
    var wd = parseWeather(weatherRaw(b.dataset.date)), v = prompt('注意・メモ（複数あるときは「／」で区切る。例：路面凍結に注意／冬用タイヤ）', wd.notes.join('／'));
    if (v === null) return;
    var existing = S.rows.settings.filter(function (x) { return x.id === 'weather:' + b.dataset.date; })[0];
    var nv = JSON.stringify({ src: wd.src, places: wd.places, notes: v.split(/／/).map(function (t) { return t.trim(); }).filter(Boolean) });
    saveRow('settings', { id: 'weather:' + b.dataset.date, value: nv }, existing ? existing.updatedAt : undefined).then(render);
  }
  else if (a === 'mapDay') { S.mapDay = b.dataset.day; S.fitted = false; updateMap(); }
  else if (a === 'mapUnsel') { delete S.mapSel[id]; updateMap(); }
  else if (a === 'mapAssign') mapAssign(b.dataset.date);
  else if (a === 'geoAll') geoAll();
  else if (a === 'rowAdd') openRowSheet(b.dataset.table);
  else if (a === 'rowEdit') openRowSheet(b.dataset.table, id);
  else if (a === 'todoState') {
    var td = S.rows.todos.filter(function (r) { return r.id === id; })[0];
    saveRow('todos', { id: id, state: td.state === '決定' ? '未決' : '決定' }, td.updatedAt).then(render);
  }
  else if (a === 'toggleBoost') { S.filters.boost = !S.filters.boost; render(); }
  else if (a === 'editNote') { S.editing = id; render(); }
  else if (a === 'cancelEdit') { S.editing = null; render(); }
  else if (a === 'saveNote') {
    var n0 = noteById(id), urls = val('f_urls').split(/\s+/).filter(Boolean);
    var row = { id: id, title: val('f_title'), kind: val('f_kind'), status: val('f_status'), day: val('f_day'), urls: JSON.stringify(urls), summary: val('f_summary'),
      address: val('f_address'), hours: val('f_hours'), closed: val('f_closed'), reservation: val('f_reservation'), budget: val('f_budget'), duration: val('f_duration'),
      needsBoost: document.getElementById('f_boost').checked ? '1' : '' };
    var addrChanged = row.address !== n0.address;
    if (addrChanged) { row.lat = ''; row.lng = ''; delete S.geoFailed[id]; }   // 住所を変えたら位置を取り直す
    saveRow('notes', row, n0.updatedAt).then(function (saved) {
      S.editing = null; toast('保存しました'); render();
      if (row.address && !hasPos(saved)) geocodeNote(id).then(function () { render(); }).catch(function () { });
    }).catch(function (e) { toast('保存できませんでした：' + (e.message || e)); });
  }
  else if (a === 'delNote') { if (confirm('この付箋を削除しますか？（予定への紐づけは外れます）')) removeRow('notes', id).then(function () { S.editing = null; location.hash = '#/notes'; }); }
  else if (a === 'refetch') { rpc({ action: 'save', table: 'notes', row: { id: id, ogpStatus: 'pending' } }).then(function () { requestOgp(id); toast('取得を依頼しました。しばらくして更新してください'); }); }
  else if (a === 'rmPhoto') { rpc({ action: 'removePhoto', id: id, fileId: b.dataset.file }).then(function (r) { applyRows({ notes: [r.row] }); saveCache(); render(); }); }
  else if (a === 'addComment') {
    var body = val('cmBody'); if (!body) return;
    saveRow('comments', { targetType: 'note', targetId: id, body: body }).then(render).catch(function (e) { toast('送信できませんでした：' + (e.message || e)); });
  }
});
document.addEventListener('change', function (ev) {
  var tg = ev.target.dataset && ev.target.dataset.toggle;
  if (tg) {   // 持ち物の準備済み・費用の支払済み
    var tp = tg.split(':'), cur = S.rows[tp[0]].filter(function (r) { return r.id === ev.target.dataset.id; })[0], patch = { id: cur.id };
    patch[tp[1]] = ev.target.checked ? '1' : '';
    saveRow(tp[0], patch, cur.updatedAt).then(render).catch(function (e) { toast('保存できませんでした：' + (e.message || e)); });
    return;
  }
  var f = ev.target.dataset && ev.target.dataset.filter;
  if (f) { S.filters[f] = ev.target.value; render(); return; }
  if (ev.target.id === 'f_photo' && S.editing) uploadFiles(S.editing, ev.target.files);
});
// 検索欄：入力欄は作り直さず、一覧だけ差し替える（日本語入力の変換中に欄が消えるのを防ぐ）。変換中は何もしない
function applyNoteSearch() {
  var box = document.getElementById('noteList');
  if (box) box.innerHTML = notesListHtml(notesFiltered());
}
document.addEventListener('input', function (ev) {
  if (ev.target.dataset && ev.target.dataset.filter === 'q') {
    S.filters.q = ev.target.value;
    if (ev.isComposing) return;
    clearTimeout(S.qt); S.qt = setTimeout(applyNoteSearch, 200);
  }
});
document.addEventListener('compositionend', function (ev) {
  if (ev.target.dataset && ev.target.dataset.filter === 'q') { S.filters.q = ev.target.value; clearTimeout(S.qt); S.qt = setTimeout(applyNoteSearch, 100); }
});
document.getElementById('fab').onclick = function () { openQuickAdd(''); };
document.getElementById('btnRefresh').onclick = function () { sync(true); };
window.addEventListener('hashchange', function () { if (S.editing && location.hash.indexOf('#/note/' + S.editing) !== 0) S.editing = null; render(); window.scrollTo(0, 0); });
setInterval(function () { if (document.visibilityState === 'visible' && !S.editing && !document.getElementById('layer').firstChild) sync(); }, 45000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') sync(); });

// ---------- 起動 ----------
(function boot() {
  if (!TOKEN) { document.getElementById('app').innerHTML = '<p style="padding:24px">URLを確認してください。</p>'; return; }
  if (!/[#&]t=/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search + (location.hash || '#/') + '&t=' + TOKEN); } catch (e) { } }
  S.who = lsGet('hk_who') || '';
  if (S.who === '夫') S.who = '宏樹'; else if (S.who === '妻') S.who = '碧依';   // 旧い選択を引き継ぐ
  try { var c = JSON.parse(lsGet('hk_cache') || 'null'); if (c && c.rows) { TABLE_NAMES.forEach(function (t) { S.rows[t] = c.rows[t] || []; }); S.since = c.since || ''; } } catch (e) { }
  // 共有メニュー（ショートカット）から「…#t=トークン&add=URL」で開かれたら、付箋の追加画面を開く（保存は本人がタップ）
  var add = takeAddParam(location.hash);
  if (add.text) { try { history.replaceState(null, '', location.pathname + location.search + add.hash); } catch (e) { } }
  render();
  if (!S.who) { S.pendingAdd = add.text; chooseWho(); }
  else if (add.text) openQuickAdd(add.text);
  sync();
})();
</script>
</body>
</html>
